name: Python CI

on:
  push:
    branches: [ main, Testing ]
  pull_request:
    branches: [ main, Testing ]
  workflow_dispatch:

jobs:
  setup:
    name: Setup & Dependency Install
    runs-on: ubuntu-latest

    outputs:
      python-path: ${{ steps.set-path.outputs.path }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Export PYTHONPATH
      id: set-path
      run: echo "path=$PWD/src" >> $GITHUB_OUTPUT

  financial:
    name: Financial Collector Test
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Export PYTHONPATH
      run: echo "PYTHONPATH=$PWD/src" >> $GITHUB_ENV
    - run: |
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        echo "PYTHONPATH=$PWD/src" >> $GITHUB_ENV
        python tests/run_financial_only.py

  reddit:
    name: Reddit Scraper Test
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Export PYTHONPATH
      run: echo "PYTHONPATH=$PWD/src" >> $GITHUB_ENV
    - run: |
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        echo "PYTHONPATH=$PWD/src" >> $GITHUB_ENV
        python tests/run_reddit_only.py
      env:
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

  twitter:
    name: Twitter Scraper Test
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Export PYTHONPATH
      run: echo "PYTHONPATH=$PWD/src" >> $GITHUB_ENV
    - run: |
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        echo "PYTHONPATH=$PWD/src" >> $GITHUB_ENV
        python tests/run_twitter_only.py
      env:
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
