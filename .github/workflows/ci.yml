name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'   # or whatever your project uses

    - name: Install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest        # if you’re using pytest

    - name: Run financial collector smoke-test
      run: |
        source venv/bin/activate
        python run_financial_only.py

    # OR, if you converted it to a pytest:
    #- name: Run pytest
    #  run: |
    #    source venv/bin/activate
    #    pytest -q
